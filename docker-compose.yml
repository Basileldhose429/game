version: "3.8"

services:
  game1:
    build: .
    environment:
      - PORT=8081
    volumes:
      - ./game.db:/app/game.db
    restart: always

  game2:
    build: .
    environment:
      - PORT=8081
    volumes:
      - ./game.db:/app/game.db
    restart: always

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - game1
      - game2
